kube_asymmetric_encryption_algorithm: "RSA-2048"
kube_cert_validity_period: 87600h
kube_ca_cert_validity_period: 87600h
kube_apiserver_feature_gates:
  - MaxUnavailableStatefulSet=true
  - PersistentVolumeClaimUnusedSinceTime=true
  - MemoryQoS=true
#  - InPlacePodVerticalScaling=true
kube_controller_feature_gates:
  - MaxUnavailableStatefulSet=true
  - PersistentVolumeClaimUnusedSinceTime=true
  - MemoryQoS=true
#  - InPlacePodVerticalScaling=true
kube_scheduler_feature_gates:
  - MaxUnavailableStatefulSet=true
  - PersistentVolumeClaimUnusedSinceTime=true
  - MemoryQoS=true
#  - InPlacePodVerticalScaling=true
kubeadm_init_phases_skip:
  - addon/kube-proxy
kube_controller_terminated_pod_gc_threshold: 20
kube_api_aggregator_routing: true
#event_ttl_duration: "6h0m0s"
