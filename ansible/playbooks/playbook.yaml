---
- name: Configure Kubernetes cluster.
  hosts: "{{ ansible_limit }}"
  gather_facts: true
  become: true
  roles:
    - apt_proxy
    - repos
    - os
    - deps
    - haproxy
    - etcd
    - kubeadm
    - master
    - cni
    - worker
    - labels
    - taints
    - cron
    - sysctl
    - kubelet
