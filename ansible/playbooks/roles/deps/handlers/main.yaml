---
- name: Generate Containerd config.
  ansible.builtin.shell: /usr/bin/containerd config default > {{ containerd_config_dir }}/config.toml
  changed_when: false

- name: Reload systemd.
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart containerd.
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
