---
- name: Aggregate all SANs.
  ansible.builtin.set_fact:
    apiserver_sans: "{{ _apiserver_sans | flatten | select | unique }}"
  vars:
    _apiserver_sans:
      - "kubernetes"
      - "kubernetes.default"
      - "kubernetes.default.svc"
      - "kubernetes.default.svc.{{ dns_domain }}"
      - "localhost"
      - "127.0.0.1"
      - "::1"
      - "{{ apiserver_loadbalancer_domain_name }}"
      - "{{ loadbalancer_apiserver.address | d('') }}"
      - "{{ groups['master'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | select('defined') }}"
      - "{{ groups['master'] | map('extract', hostvars, ['ansible_default_ipv6', 'address']) | select('defined') }}"
      - "{{ groups['master'] | map('extract', hostvars, 'ansible_hostname') }}"
      - "{{ groups['master'] | map('extract', hostvars, 'ansible_fqdn') }}"
  tags:
    - kubeadm

- name: Read bootstrap token from Vault.
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    engine_mount_point: "{{ vault_mount | default('secret') }}"
    path: "{{ cluster_name }}/bootstrap_token"
    token: "{{ vault_token }}"
  delegate_to: localhost
  become: false
  register: bootstrap_token_vault
  no_log: true
  when: inventory_hostname == groups['master'][0]
  tags:
    - kubeadm

- name: Save bootstrap token in fact.
  ansible.builtin.set_fact:
    kubeadm_bootstrap_token: "{{ bootstrap_token_vault.secret.value | trim }}"
  no_log: true
  when: inventory_hostname == groups['master'][0]
  tags:
    - kubeadm

- name: Write kubeadm config.
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{ kube_config_dir }}/kubeadm-config.yaml"
    mode: '0600'
    owner: root
    backup: true
    validate: "kubeadm config validate --config %s"
  register: kubeadm_config_result
  when: inventory_hostname == groups['master'][0]
  tags:
    - kubeadm

# upgrade configs

- name: Check if kube-apiserver manifest exists.
  ansible.builtin.stat:
    path: "{{ kube_manifest_dir }}/kube-apiserver.yaml"
  register: kube_apiserver_manifest
  when:
    - inventory_hostname == groups['master'][0]
  tags:
    - kubeadm

- name: Upload configs to cluster.
  when:
    - inventory_hostname == groups['master'][0]
    - kubeadm_config_result.changed | default(false)
    - kube_apiserver_manifest.stat.exists | default(false)
  block:
    - name: Upload kubeadm config to cluster.
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - phase
          - upload-config
          - kubeadm
          - --config
          - "{{ kube_config_dir }}/kubeadm-config.yaml"
      changed_when: true

    - name: Upload kubelet config to cluster.
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - phase
          - upload-config
          - kubelet
          - --config
          - "{{ kube_config_dir }}/kubeadm-config.yaml"
      changed_when: true
  tags:
    - kubeadm

- name: Apply new changes to control-plane.
  throttle: 1
  ansible.builtin.command:
    argv:
      - kubeadm
      - upgrade
      - node
      - phase
      - control-plane
  when:
    - upgrade_config | default(false) | bool
    - "'master' in group_names"
  tags:
    - kubeadm
