---
# Copy certs from vault

- name: Copy certs to masters from Vault.
  when: "'master' in group_names"
  block:
    - name: Define master certificates.
      ansible.builtin.set_fact:
        vault_certs:
          - name: ca.crt
            dest: "{{ kube_cert_dir }}/ca.crt"
            mode: "0644"
            owner: root

          - name: ca.key
            dest: "{{ kube_cert_dir }}/ca.key"
            mode: "0600"
            owner: root

          - name: front-proxy-ca.crt
            dest: "{{ kube_cert_dir }}/front-proxy-ca.crt"
            mode: "0644"
            owner: root

          - name: front-proxy-ca.key
            dest: "{{ kube_cert_dir }}/front-proxy-ca.key"
            mode: "0600"
            owner: root

          - name: sa.pub
            dest: "{{ kube_cert_dir }}/sa.pub"
            mode: "0644"
            owner: root

          - name: sa.key
            dest: "{{ kube_cert_dir }}/sa.key"
            mode: "0600"
            owner: root

    - name: Read certificates from Vault.
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        engine_mount_point: "{{ vault_mount | default('secret') }}"
        path: "{{ cluster_name }}/{{ item.name }}"
        token: "{{ vault_token }}"
      delegate_to: localhost
      become: false
      loop: "{{ vault_certs }}"
      register: vault_certs_data
      no_log: true

    - name: Copy certificates.
      ansible.builtin.copy:
        content: "{{ item.1.secret.value }}"
        dest: "{{ item.0.dest }}"
        mode: "{{ item.0.mode }}"
        owner: "{{ item.0.owner }}"
      loop: "{{ vault_certs | zip(vault_certs_data.results) | list }}"
      no_log: true
  tags:
    - master

# Initialize cluster

- name: Initialize the HA-cluster.
  ansible.builtin.shell: |
    kubeadm init \
    --v=5 \
    --config={{ kube_config_dir }}/kubeadm-config.yaml \
    --skip-phases={{ kubeadm_init_phases_skip | join(',') }} > cluster_initialized.log 2>&1
  args:
    chdir: /home/{{ ansible_user }}
    creates: "{{ kube_manifest_dir }}/kube-apiserver.yaml"
  when:
    - inventory_hostname == groups['master'][0]
  tags:
    - master

# Join other master nodes

- name: Save facts on first master node.
  when: inventory_hostname == groups['master'][0]
  block:
    - name: Calculate CA public key hash on first master.
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -pubkey
          - -in
          - "{{ kube_cert_dir }}/ca.crt"
      register: ca_pubkey
      changed_when: false

    - name: Calculate CA hash.
      ansible.builtin.shell: |
        printf '%s\n' {{ ca_pubkey.stdout | quote }} |
          openssl rsa -pubin -outform der 2>/dev/null |
          openssl dgst -sha256 -hex |
          sed 's/^.* //'
      register: ca_hash_result
      changed_when: false

    - name: Save CA hash as a fact on the first master.
      ansible.builtin.set_fact:
        kubeadm_ca_hash: "{{ ca_hash_result.stdout }}"

    - name: Read bootstrap token from Vault.
      community.hashi_vault.vault_kv2_get:
        url: "{{ vault_addr }}"
        engine_mount_point: "{{ vault_mount | default('secret') }}"
        path: "{{ cluster_name }}/bootstrap_token"
        token: "{{ vault_token }}"
      delegate_to: localhost
      become: false
      register: bootstrap_token_vault
      no_log: true

    - name: Save bootstrap token in fact.
      ansible.builtin.set_fact:
        kubeadm_bootstrap_token: "{{ bootstrap_token_vault.secret.value | trim }}"
      no_log: true
  tags:
    - master

- name: Join other master nodes.
  when: inventory_hostname in groups['master'][1:]
  throttle: 1
  block:
    - name: Check the availability api server port.
      ansible.builtin.wait_for:
        host: "{{ loadbalancer_apiserver.address }}"
        port: "{{ loadbalancer_apiserver.port }}"

    - name: Join master node to cluster.
      ansible.builtin.shell: |
        kubeadm join \
          "{{ loadbalancer_apiserver.address }}:{{ loadbalancer_apiserver.port }}" \
          --v=5 \
          --token "{{ hostvars[groups['master'][0]]['kubeadm_bootstrap_token'] }}" \
          --discovery-token-ca-cert-hash "sha256:{{ hostvars[groups['master'][0]]['kubeadm_ca_hash'] }}" \
          --control-plane > node_joined.log 2>&1
      args:
        chdir: /home/{{ ansible_user }}
        creates: "{{ kube_manifest_dir }}/kube-apiserver.yaml"
  tags:
    - master
