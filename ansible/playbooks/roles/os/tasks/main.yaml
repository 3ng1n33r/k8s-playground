---
# Upgrade the OS

- name: Upgrade OS.
  when: upgrade_os | default(false) | bool
  block:
    - name: Upgrade the OS (apt-get dist-upgrade).
      ansible.builtin.apt:
        upgrade: dist
        update_cache: yes

    - name: Check if a reboot is needed.
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/run/reboot-required
        - /var/run/reboot-required.pkgs
      register: reboot_required_files

    - name: Reboot, if needed.
      ansible.builtin.reboot:
      when: reboot_required_files.results | selectattr('stat.exists') | list | length > 0

    - name: Remove dependencies that are no longer required.
      ansible.builtin.apt:
        autoremove: true
  tags:
    - os

# Unattended Upgrades

- name: Create unattended-upgrades directory.
  ansible.builtin.file:
    path: "/etc/apt/apt.conf.d/50unattended-upgrades.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - os

- name: Ensure unattended-upgrades blacklists kernel packages.
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades.d/disable-kernel-upgrades
    content: |
      // Added by Ansible to prevent automatic kernel upgrades
      Unattended-Upgrade::Package-Blacklist {
          "linux-image-raspi";
          "linux-image";
          "linux-headers";
          "linux-modules";
      };
    owner: root
    group: root
    mode: '0644'
  tags:
    - os

- name: Disable unattended-upgrades.
  when:
    - not unattended_upgrades | bool
  block:
    - name: Disable unattended-upgrades service.
      ansible.builtin.systemd_service:
        name: unattended-upgrades
        enabled: false
        state: stopped
      ignore_errors: true

    - name: Disable periodic package updates.
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";
  tags:
    - os

# Raspberry Pi EEPROM updates

- name: Mask rpi-eeprom-update service.
  ansible.builtin.systemd_service:
    name: rpi-eeprom-update.service
    state: stopped
    enabled: false
    masked: true
  ignore_errors: true
  when:
    - not rpi_eeprom_update | bool
  tags:
    - os

- name: Configure journald.
  ansible.builtin.lineinfile:
    dest: /etc/systemd/journald.conf
    regexp: "^SystemMaxUse"
    line: "SystemMaxUse=100M"
    backup: true
  notify: Restart journald.
  tags:
    - os

- name: Set LOGINTERVAL for atop.
  ansible.builtin.lineinfile:
    path: /etc/default/atop
    regexp: '^LOGINTERVAL='
    line: 'LOGINTERVAL=60'
    backup: true
  notify: Restart atop.
  tags:
    - os

- name: Set LOGGENERATIONS for atop.
  ansible.builtin.lineinfile:
    path: /etc/default/atop
    regexp: '^LOGGENERATIONS='
    line: 'LOGGENERATIONS=7'
    backup: true
  notify: Restart atop.
  tags:
    - os

# IRQ affinity

- name: IRQ affinity.
  when:
    - irq_affinity | default(false) | bool
  block:
    - name: Copy Ethernet IRQs script.
      ansible.builtin.copy:
        src: files/eth-irq-affinity.sh
        dest: "{{ bin_dir }}/eth-irq-affinity.sh"
        owner: root
        group: root
        mode: '0755'

    - name: Ethernet IRQs unit.
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Pin Ethernet IRQs to CPU 0
          After=network-pre.target
          Wants=network-pre.target

          [Service]
          Type=oneshot
          ExecStart={{ bin_dir }}/eth-irq-affinity.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/eth-irq-affinity.service"
        mode: '0644'

    - name: Enable and start the IRQ affinity service.
      ansible.builtin.systemd_service:
        name: eth-irq-affinity.service
        state: started
        daemon_reload: true
        enabled: true
  tags:
    - os
