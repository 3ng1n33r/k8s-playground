---
- name: Install required packages.
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
    state: present
    update_cache: true
  tags:
    - repos

- name: Add Docker apt-key.
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker-apt-keyring.asc
    mode: '0644'
    force: true
  tags:
    - repos

- name: Add Docker's APT repo.
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker-apt-keyring.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: true
  tags:
    - repos

- name: Add Kubernetes apt-key.
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_pkg_version.split('-')[0].rsplit('.', 1)[0] }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: true
  tags:
    - repos

- name: Add Kubernetes APT repository.
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_pkg_version.split('-')[0].rsplit('.', 1)[0] }}/deb/ /"
    state: present
    update_cache: true
  tags:
    - repos

- name: Add Helm apt-key.
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /etc/apt/keyrings/helm-apt-keyring.asc
    mode: '0644'
    force: true
  tags:
    - repos

- name: Add Helm's APT repo.
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/helm-apt-keyring.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    state: present
    update_cache: true
  tags:
    - repos
