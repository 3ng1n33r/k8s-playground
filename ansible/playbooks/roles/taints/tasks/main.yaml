---
- name: Remove taint for master node.
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - /etc/kubernetes/admin.conf
      - taint
      - node
      - "{{ ansible_hostname }}"
      - node-role.kubernetes.io/control-plane:NoSchedule-
  delegate_to: "{{ groups['master'][0] }}"
  when: 
    - "'master' in group_names"
    - not control_plane_taints_enabled | bool
  ignore_errors: true
  tags:
    - taints
