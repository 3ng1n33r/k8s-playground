---
# ansible-playbook -i inventory/hosts.yaml runbooks/upgrade_worker.yaml -e "upgrade_cri=true" -e "ignore_version=true" -CD
- name: Runbooks | Upgrade Kubernetes on other nodes.
  hosts: worker
  serial: 1
  become: true
  tasks:
    - name: Get package facts.
      ansible.builtin.package_facts:
        manager: apt

    - name: Set the fact to the current kubeadm version.
      ansible.builtin.set_fact:
        current_version: "{{ ansible_facts.packages['kubeadm'][0].version.split('-')[0] }}"
        desired_version: "{{ kubernetes_pkg_version.split('-')[0] }}"

    - name: Upgrade worker nodes.
      when:
        - >
          (current_version is version(desired_version, '<', version_type='semver'))
          or (ignore_version | default(false) | bool)
      block:
        - name: Run repos role.
          ansible.builtin.include_role:
            name: repos

        - name: Drain node.
          ansible.builtin.command: kubectl drain {{ ansible_hostname }} --ignore-daemonsets --delete-emptydir-data
          delegate_to: localhost
          ignore_errors: true
          become: false

        - name: Allow Kubeadm to be upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop:
            - kubeadm

        - name: Install Kubeadm.
          ansible.builtin.apt:
            name:
              - kubeadm={{ kubernetes_pkg_version }}
            state: present

        - name: Upgrading worker node.
          ansible.builtin.shell: | 
            kubeadm upgrade node > node_upgrade_v{{ desired_version }}.log 2>&1
          args:
            chdir: /home/{{ ansible_user }}

        - name: Allow Kubectl, Kubelet to be upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop:
            - kubelet
            - kubectl

        - name: Allow ContainerD to be upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop:
            - containerd.io
          when: upgrade_cri | default(false) | bool

        - name: Install Kubectl, Kubelet.
          ansible.builtin.apt:
            name:
              - kubelet={{ kubernetes_pkg_version }}
              - kubectl={{ kubernetes_pkg_version }}
            state: present

        - name: Install ContainerD.
          ansible.builtin.apt:
            name:
              - containerd.io={{ containerd_pkg_version }}
            state: present
          when: upgrade_cri | default(false) | bool

        - name: Prevent Kubeadm, Kubectl, Kubelet from being upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop:
            - kubeadm
            - kubelet
            - kubectl

        - name: Prevent ContainerD from being upgraded.
          ansible.builtin.dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop:
            - containerd.io
          when: upgrade_cri | default(false) | bool

        - name: Start service containerd, if not started.
          ansible.builtin.systemd_service:
            state: restarted
            name: containerd
          when: upgrade_cri | default(false) | bool

        - name: Restart service kubelet, also issue daemon-reload to pick up config changes.
          ansible.builtin.systemd_service:
            state: restarted
            daemon_reload: true
            name: kubelet

        - name: Wait a little time.
          ansible.builtin.pause:
            seconds: 60

        - name: Uncordon node.
          ansible.builtin.command: kubectl uncordon {{ ansible_hostname }}
          delegate_to: localhost
          become: false
