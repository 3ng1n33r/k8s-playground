apiVersion: apps/v1
kind: Deployment
metadata:
  name: vessel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vessel
  template:
    metadata:
      labels:
        app: vessel
    spec:
      imagePullSecrets:
        - name: regcred-dockerhub
      containers:
        - name: app
          image: pitipiwpiwwiwwiw/vessel:1.26.10 # {"$imagepolicy": "flux-system:vessel"}
          ports:
            - name: http
              containerPort: 5000
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vessel
  annotations:
    lbipam.cilium.io/ips: "192.168.100.10"
spec:
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: LoadBalancer
  selector:
    app: vessel
