---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 24h
  url: oci://quay.io/jetstack/charts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cert-manager
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: jetstack
      version: 1.21.2
  install:
    createNamespace: true
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  values:
    config:
      enableGatewayAPI: true
    crds:
      enabled: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
        interval: 60s
        scrapeTimeout: 30s
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
