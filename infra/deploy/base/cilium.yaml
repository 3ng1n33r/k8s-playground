---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.1
  dependsOn:
    - name: kube-prometheus-stack
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  values:
    kubeProxyReplacement: true
    k8sServiceHost: cluster-endpoint
    k8sServicePort: 8443
    rollOutCiliumPods: false
#    updateStrategy:
#      type: OnDelete
    gatewayAPI:
      enabled: true
#    k8sClientRateLimit:
#      burst: 100
#      qps: 50
#    l2announcements:
#      enabled: true
    bgpControlPlane:
      enabled: true
    ipam:
      operator:
        clusterPoolIPv4PodCIDRList: ["10.95.0.0/22"]
        clusterPoolIPv4MaskSize: 24
#    extraConfig:
#      ipv4-service-range: "10.96.0.0/23"
    ipv4:
      enabled: true
    envoy:
      enabled: false
    operator:
      rollOutPods: false
      replicas: 2
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    ipv4NativeRoutingCIDR: "10.95.0.0/22"
    autoDirectNodeRoutes: true
    bpfClockProbe: true
    routingMode: native
    bpf:
      datapathMode: netkit
      masquerade: true
      mapDynamicSizeRatio: 0.08
      distributedLRU:
        enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
      metrics:
        enableOpenMetrics: false
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: false
        dashboards:
          enabled: false
          label: grafana_dashboard
          labelValue: "1"
