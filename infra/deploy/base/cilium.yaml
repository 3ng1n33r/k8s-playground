---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  chart:
    spec:
      chart: cilium
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: cilium
      version: 1.20.2
  upgrade:
    disableWait: true
  dependsOn:
    - name: kube-prometheus-stack
  interval: 30m
  releaseName: cilium
  targetNamespace: kube-system
  values:
    priorityClassName: "system-node-critical"
    rollOutCiliumPods: false
    updateStrategy:
      type: OnDelete
      rollingUpdate: null
    kubeProxyReplacement: true
    k8sServiceHost: "127.0.0.1"
    k8sServicePort: 8443
    gatewayAPI:
      enabled: true
    bgpControlPlane:
      enabled: true
    ipam:
      mode: "cluster-pool"
      operator:
        clusterPoolIPv4PodCIDRList: ["10.95.0.0/22"]
        clusterPoolIPv4MaskSize: 24
    ipv4:
      enabled: true
    envoy:
      enabled: false
    operator:
      replicas: 2
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.cilium/app: operator
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
    ipv4NativeRoutingCIDR: "10.95.0.0/22"
    autoDirectNodeRoutes: true
    bpfClockProbe: true
    routingMode: native
    bpf:
      datapathMode: netkit
      masquerade: true
      mapDynamicSizeRatio: 0.08
      distributedLRU:
        enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
    hubble:
      enabled: true
      relay:
        enabled: false
      ui:
        enabled: false
      metrics:
        enableOpenMetrics: true
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
