---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluent
  namespace: flux-system
spec:
  interval: 24h
  url: https://fluent.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit-k8s-events
  namespace: flux-system
spec:
  chart:
    spec:
      chart: fluent-bit
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: fluent
      version: 0.58.3
  install:
    createNamespace: true
  dependsOn:
    - name: loki
  interval: 30m
  releaseName: fluent-bit-k8s-events
  targetNamespace: fluent-bit-k8s-events
  values:
    kind: Deployment
    replicaCount: 1
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    rbac:
      create: true
      eventsAccess: true
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    config:
      filters: |
      inputs: |
        [INPUT]
            Name                      kubernetes_events
            Tag                       k8s.events
            Kube_URL                  https://kubernetes.default.svc
            TLS.Verify                On
            Kube_Retention_Time       1h
      outputs: |
        [OUTPUT]
            Name                      loki
            Match                     k8s.events
            Host                      loki-gateway.logging.svc.cluster.local
            Port                      80
            Labels                    job=kubernetes-events
            Line_Format               json
            Retry_Limit               False
