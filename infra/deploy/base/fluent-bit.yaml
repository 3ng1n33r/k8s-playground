---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluent
  namespace: flux-system
spec:
  interval: 24h
  url: https://fluent.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  chart:
    spec:
      chart: fluent-bit
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: fluent
      version: 0.58.3
  dependsOn:
    - name: loki
  interval: 30m
  releaseName: fluent-bit
  targetNamespace: logging
  values:
    kind: DaemonSet
    priorityClassName: "system-node-critical"
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
    - operator: "Exists"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
#    securityContext:
#      privileged: true
      capabilities:
        add:
        - CAP_SYSLOG
    extraVolumes:
      - name: dev-kmsg  
        hostPath:  
          path: /dev/kmsg  
          type: CharDevice
    extraVolumeMounts:
      - name: dev-kmsg  
        mountPath: /dev/kmsg 
    config:
      inputs: |
        [INPUT]
            Name              kmsg
            Tag               kernel
            Threaded          On
            Read_From_Tail    Off
            Prio_Level        8
      filters: |
      outputs: |
        [OUTPUT]
            Name              loki
            Match             kernel
            Host              loki-gateway.logging.svc.cluster.local
            Port              80
            Labels            job=kernel
            Line_Format       json
            Retry_Limit       False
