---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 24h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ingress-nginx
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
      version: 4.15.1
  install:
    createNamespace: true
  interval: 30m
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  values:
    controller:
      replicaCount: 2
      minAvailable: 1
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/ingress: ""
      admissionWebhooks:
        patch:
          nodeSelector:
            kubernetes.io/os: linux
            node-role.kubernetes.io/ingress: ""
#      metrics:
#        enabled: true
#        serviceMonitor:
#          enabled: true
#          additionalLabels:
#            release: kube-prometheus-stack
      resources:
        limits:
          cpu: 200m
          memory: 180Mi
        requests:
          cpu: 100m
          memory: 90Mi
      service:
        type: LoadBalancer
        annotations:
          "lbipam.cilium.io/ips": "192.168.31.8"
