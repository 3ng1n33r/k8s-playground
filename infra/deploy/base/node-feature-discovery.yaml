---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfd
  namespace: flux-system
spec:
  interval: 24h0m0s
  url: https://kubernetes-sigs.github.io/node-feature-discovery/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: flux-system
spec:
  chart:
    spec:
      chart: node-feature-discovery
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: nfd
      version: 0.19.0
  timeout: 10m0s
  interval: 30m0s
  install:
    createNamespace: true
  releaseName: node-feature-discovery
  targetNamespace: node-feature-discovery
  values:
    master:
      enable: true
#      extraArgs: 
#        - "-v=2"
      replicaCount: 1
      resources:
        limits:
          memory: 256Gi
          cpu: 200m
        requests:
          cpu: 100m
          memory: 128Mi
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: "node-role.kubernetes.io/control-plane"
                    operator: In
                    values: [""]
    gc:
      enable: true
      replicaCount: 1
      interval: 1h
      resources:
        limits:
          memory: 256Gi
          cpu: 200m
        requests:
          cpu: 10m
          memory: 128Mi
    worker:
      enable: true
      priorityClassName: "system-node-critical"
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        value: ""
        effect: "NoSchedule"
      resources:
        limits:
          cpu: 250m
          memory: 128Mi
        requests:
          cpu: 5m
          memory: 64Mi
      config:
        core:
          sleepInterval: 300s
          labelSources: []
